<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 金馬年飆股菁英班運勢抽籤</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #D91E18;
            --dark-red: #960000;
            --gold: #F1C40F;
            --metallic-gold: #D4AF37;
            --paper-bg: #FFFDF5;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止連點選取文字 */
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--dark-red);
            background-image: 
                radial-gradient(circle at 50% 30%, var(--primary-red) 0%, var(--dark-red) 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景裝飾：金粉效果 */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--metallic-gold) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        /* 標題區 */
        header {
            text-align: center;
            z-index: 2;
            margin-bottom: 2rem;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            padding: 0 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        header h2 {
            font-size: 1.2rem;
            font-weight: normal;
            color: #fff;
            opacity: 0.9;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 籤筒容器 */
        .shaker-container {
            position: relative;
            width: 200px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.2s;
        }

        .shaker-container:active {
            transform: scale(0.98);
        }

        /* CSS 畫的籤筒 */
        .canister {
            width: 140px;
            height: 180px;
            background: linear-gradient(90deg, #8E44AD, #9B59B6, #8E44AD); /* 紫氣東來 */
            background: linear-gradient(90deg, #600000, #b90000, #600000); /* 傳統紅 */
            border-radius: 10px 10px 40px 40px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 4px solid var(--metallic-gold);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 籤筒上的「簽」字 */
        .canister::after {
            content: "金馬";
            font-size: 2rem;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 5px 10px;
            border-radius: 5px;
            writing-mode: vertical-rl;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 籤筒裡的籤 */
        .sticks {
            position: absolute;
            top: -40px;
            width: 100px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            z-index: -1;
        }

        .stick {
            width: 12px;
            height: 100%;
            background: #E67E22;
            margin: 0 2px;
            border-radius: 5px 5px 0 0;
            border: 1px solid #D35400;
            transform-origin: bottom center;
        }

        /* 隨機旋轉一點點讓籤看起來自然 */
        .stick:nth-child(1) { transform: rotate(-10deg) translateY(10px); height: 80%; }
        .stick:nth-child(2) { transform: rotate(-5deg) translateY(5px); height: 90%; }
        .stick:nth-child(3) { transform: rotate(0deg); height: 100%; }
        .stick:nth-child(4) { transform: rotate(5deg) translateY(5px); height: 90%; }
        .stick:nth-child(5) { transform: rotate(10deg) translateY(10px); height: 85%; }

        /* 按鈕 */
        .action-btn {
            margin-top: 3rem;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-family: 'Noto Serif TC', serif;
            font-weight: bold;
            color: var(--dark-red);
            background: linear-gradient(to bottom, #FFE680, #D4AF37);
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3), inset 0 2px 0 rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(241, 196, 15, 0.4), inset 0 2px 0 rgba(255,255,255,0.5);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* 搖晃動畫 */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-5px, -5px) rotate(-5deg); }
            20% { transform: translate(5px, 5px) rotate(5deg); }
            30% { transform: translate(-5px, 5px) rotate(-5deg); }
            40% { transform: translate(5px, -5px) rotate(5deg); }
            50% { transform: translate(-5px, -5px) rotate(-5deg); }
            60% { transform: translate(5px, 5px) rotate(5deg); }
            70% { transform: translate(-5px, 5px) rotate(-5deg); }
            80% { transform: translate(5px, -5px) rotate(5deg); }
            90% { transform: translate(-5px, -5px) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shaking {
            animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 結果彈窗 (Overlay) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 籤詩卡片 */
        .fortune-card {
            width: 90%;
            max-width: 400px;
            background: var(--paper-bg);
            border: 8px solid var(--dark-red);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            position: relative;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        .overlay.show .fortune-card {
            transform: scale(1);
        }

        .card-header {
            font-size: 1.5rem;
            color: var(--dark-red);
            border-bottom: 2px solid var(--metallic-gold);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            font-weight: 900;
        }

        .card-type {
            background-color: var(--primary-red);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .card-content {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 2rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn {
            background: var(--dark-red);
            color: var(--gold);
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
        }

        /* 裝飾性燈籠 */
        .lantern {
            position: absolute;
            top: -20px;
            width: 80px;
            height: 100px; /* 包含流蘇的高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            animation: swing 3s infinite ease-in-out alternate;
        }

        .lantern-body {
            width: 60px;
            height: 50px;
            background-color: #e74c3c;
            border-radius: 20px;
            border: 2px solid #c0392b;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: gold;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .lantern-tassel {
            width: 4px;
            height: 30px;
            background-color: gold;
            margin-top: -2px;
        }

        @keyframes swing {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }

        .l-left { left: 10%; animation-delay: 0s; }
        .l-right { right: 10%; animation-delay: 1s; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .shaker-container { transform: scale(0.9); }
        }

    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <!-- 裝飾燈籠 -->
    <div class="lantern l-left">
        <div class="lantern-body">春</div>
        <div class="lantern-tassel"></div>
    </div>
    <div class="lantern l-right">
        <div class="lantern-body">福</div>
        <div class="lantern-tassel"></div>
    </div>

    <header>
        <h1>2026 金馬奔騰</h1>
        <h2>飆股菁英班運勢抽籤</h2>
    </header>

    <div class="shaker-container" id="shaker" onclick="drawFortune()">
        <div class="sticks">
            <div class="stick"></div>
            <div class="stick"></div>
            <div class="stick"></div>
            <div class="stick"></div>
            <div class="stick"></div>
        </div>
        <div class="canister"></div>
    </div>

    <button class="action-btn" onclick="drawFortune()">點擊求籤</button>

    <!-- 結果彈窗 -->
    <div class="overlay" id="overlay">
        <div class="fortune-card">
            <div class="card-type" id="fortune-type">上上籤</div>
            <h3 class="card-header" id="fortune-title">財源滾滾</h3>
            <p class="card-content" id="fortune-text">
                老闆突然看你很順眼，決定用錢羞辱你。
            </p>
            <button class="close-btn" onclick="closeModal()">謝主隆恩</button>
        </div>
    </div>

    <script>
        // 籤詩資料庫
        const fortunes = [
            {
                type: "上上籤",
                title: "開盤即解套",
                text: "恭喜！你那支住套房很久的股票，主力突然睡醒了，準備連拉三根漲停板帶你飛。"
            },
            {
                type: "特吉",
                title: "少年股神",
                text: "買綠賣紅這種事與你無關。你的操作行雲流水，抄底都在最低點，這波行情你是主角。"
            },
            {
                type: "大吉",
                title: "獲利翻倍",
                text: "你的投資組合綠光罩頂...啊不是，是紅光滿面！資產增長速度比老闆的血壓還快。"
            },
            {
                type: "上上籤",
                title: "升遷像搭電梯",
                text: "組織改組竟然是為了幫你鋪路？準備好換大辦公室，記得練習揮手致意的姿勢。"
            },
            {
                type: "大吉",
                title: "加薪無上限",
                text: "老闆突然良心發現，覺得不能沒有你。這次加薪的幅度，夠你買好幾張飆股了。"
            },
            {
                type: "中吉",
                title: "貴人運爆棚",
                text: "雷隊友突然離職了，神隊友剛好入職。遇到困難都有人幫你坦，根本是職場強運王。"
            },
            {
                type: "上吉",
                title: "專案自動導航",
                text: "需求不變更、時程不延後、驗收一次過。這種都市傳說竟然發生在你身上！"
            },
            {
                type: "特吉",
                title: "睏霸數錢",
                text: "睡醒發現美股大漲，台股接力噴出。你只要負責呼吸，錢就會自己流進來。"
            },
            {
                type: "吉",
                title: "小人退散",
                text: "背後講你壞話的人突然都咬到舌頭。你的職場磁場太強，壞東西自動彈開。"
            },
            {
                type: "吉",
                title: "現買現賺",
                text: "你的手指就是點金石，下單確認鍵按下去的那一刻，就是資產翻倍的開始。"
            }
        ];

        let isShaking = false;

        function drawFortune() {
            if (isShaking) return;
            
            const shaker = document.getElementById('shaker');
            isShaking = true;

            // 1. 加入搖晃動畫 Class
            shaker.classList.add('shaking');

            // 2. 震動手機 (如果支援)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 100]);
            }

            // 3. 等待動畫結束後顯示結果 (800ms)
            setTimeout(() => {
                shaker.classList.remove('shaking');
                showResult();
                isShaking = false;
            }, 800);
        }

        function showResult() {
            // 隨機選取籤詩
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const result = fortunes[randomIndex];

            // 更新 DOM
            document.getElementById('fortune-type').innerText = result.type;
            document.getElementById('fortune-title').innerText = result.title;
            document.getElementById('fortune-text').innerText = result.text;

            // 顯示遮罩與卡片
            const overlay = document.getElementById('overlay');
            overlay.classList.add('show');
        }

        function closeModal() {
            const overlay = document.getElementById('overlay');
            overlay.classList.remove('show');
        }

        // 點擊遮罩背景也可以關閉
        document.getElementById('overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
